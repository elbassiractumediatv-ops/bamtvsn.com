 <ellipse cx="250" cy="290" rx="205" ry="97" fill="#075b2d"/>
 <text x="250" y="330" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="126" fill="#fff">BAM</text>
 <circle cx="433" cy="423" r="91" fill="#c91e2b" stroke="#fff" stroke-width="12"/>
 <text x="433" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="62" fill="#fff">Tv</text>
 <text x="433" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="34" fill="#fff">SN</text>
</g></svg>