<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1515 696" role="img" aria-labelledby="title desc">
<title id="title">BAM TV SN</title><desc id="desc">Logo circulaire vert et blanc BAM, avec badge rouge Tv SN.</desc>
<defs>
 <radialGradient id="green" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#39c66a"/><stop offset=".48" stop-color="#087a39"/><stop offset="1" stop-color="#03451f"/></radialGradient>
 <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dff7e7"/><stop offset="1" stop-color="#8bc99d"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)" transform="translate(507 8)">
 <circle cx="250" cy="340" r="270" fill="#063b20" opacity=".5"/>
 <circle cx="250" cy="320" r="260" fill="url(#green)" stroke="#fff" stroke-width="16"/>
 <circle cx="250" cy="320" r="238" fill="none" stroke="#9be7b3" stroke-width="5" opacity=".75"/>
