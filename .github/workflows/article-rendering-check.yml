name: Validate article content rendering

on:
  push:
    branches:
      - fix/article-html-rendering
  pull_request:
    branches:
      - main
    paths:
      - 'app/actualites/**'
      - 'app/globals.css'
      - 'lib/article-html.js'
      - 'package.json'
      - '.github/workflows/article-rendering-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check_placeholder
          NEXT_PUBLIC_SITE_URL: https://bamtv-sn.netlify.app
